<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management Portal</title>
  <meta name="description" content="Simple, fast, and modern interface for submitting and tracking customer orders.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-decorations">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">OrderFlow</h1>
          <p class="brand-subtitle">Fast Order Creation API Console</p>
        </div>
      </div>
      <div class="server-status-badge">
        <span class="status-indicator"></span>
        <span id="api-status-text">API Online</span>
      </div>
    </header>

    <main class="content-grid">
      <!-- Order Form Section -->
      <section class="card form-card">
        <div class="card-header">
          <h2 class="card-title">Create New Order</h2>
          <p class="card-description">Fill in the order details to dispatch a POST request to <code>/api/orders</code></p>
        </div>

        <form id="order-form" class="order-form" novalidate>
          <!-- Product ID Field -->
          <div class="form-group">
            <label for="product-id" class="form-label">
              <span>Product ID</span>
              <span class="required-badge">Required</span>
            </label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="8" height="8" x="3" y="3" rx="2"/>
                <path d="m7 11 4-4"/>
                <rect width="8" height="8" x="13" y="13" rx="2"/>
              </svg>
              <input 
                type="text" 
                id="product-id" 
                name="productId" 
                placeholder="e.g. PROD-101 or iPhone-15"
                autocomplete="off"
                required
              >
            </div>
            <div class="quick-tags">
              <span class="tag-label">Presets:</span>
              <button type="button" class="preset-tag" data-preset="PROD-TECH-401">TECH-401</button>
              <button type="button" class="preset-tag" data-preset="PROD-AUDIO-99">AUDIO-99</button>
              <button type="button" class="preset-tag" data-preset="PROD-ACC-10">ACC-10</button>
            </div>
          </div>

          <!-- Quantity Field -->
          <div class="form-group">
            <label for="quantity" class="form-label">
              <span>Quantity</span>
              <span class="required-badge">Required</span>
            </label>
            <div class="quantity-controller">
              <button type="button" id="qty-decrease" class="qty-btn" aria-label="Decrease quantity">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <input 
                type="number" 
                id="quantity" 
                name="quantity" 
                min="1" 
                step="1" 
                value="1" 
                required
              >
              <button type="button" id="qty-increase" class="qty-btn" aria-label="Increase quantity">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>

          <!-- Customer Email Field -->
          <div class="form-group">
            <label for="customer-email" class="form-label">
              <span>Customer Email</span>
              <span class="required-badge">Required</span>
            </label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input 
                type="email" 
                id="customer-email" 
                name="customerEmail" 
                placeholder="customer@example.com"
                autocomplete="email"
                required
              >
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submit-btn" class="primary-button">
            <span class="btn-text">Submit Order</span>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
            <div class="spinner" id="btn-spinner"></div>
          </button>
        </form>
      </section>

      <!-- Right Column: Recent Activity & Order Receipt -->
      <section class="card response-card">
        <div class="card-header flex-header">
          <div>
            <h2 class="card-title">Recent Orders</h2>
            <p class="card-description">Real-time orders stored in memory</p>
          </div>
          <button id="refresh-orders-btn" class="secondary-button" title="Refresh orders list">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
              <path d="M8 16H3v5"/>
            </svg>
          </button>
        </div>

        <!-- Latest Order Banner (appears when order is placed) -->
        <div id="latest-order-banner" class="latest-order-banner hidden">
          <div class="banner-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>Order Placed Successfully!</span>
          </div>
          <div class="banner-body" id="latest-order-content">
            <!-- Populated via JS -->
          </div>
        </div>

        <!-- Orders List Container -->
        <div id="orders-container" class="orders-list">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </div>
            <p class="empty-title">No orders yet</p>
            <p class="empty-subtitle">Use the form on the left to submit your first order.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="alert">
      <div class="toast-icon" id="toast-icon"></div>
      <div class="toast-message" id="toast-message"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
